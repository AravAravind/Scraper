name: Daily Kaggle Trending Downloader

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows you to manually trigger the pipeline from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Selenium and Undetected Chromedriver
        run: |
          pip install selenium undetected-chromedriver

      - name: Run Scraper Script
        env:
          # These must match the names you give your GitHub Secrets
          KAGGLE_SESSION_ID: ${{ secrets.KAGGLE_SESSION_ID }}
          KAGGLE_XSRF_TOKEN: ${{ secrets.KAGGLE_XSRF_TOKEN }}
        run: python scraper.py

      - name: Upload Downloaded Dataset
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-trending-data
          # This path should match the download_dir in your Python script
          path: downloads/
          # Keep the file for 7 days
          retention-days: 7